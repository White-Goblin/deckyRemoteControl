<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<title>Remote Control</title>
<style>
  :root { --vh: 100dvh; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: var(--vh); background: #0e1117; color: #8b95a7;
    font: 15px system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
  :root { --row: 52px; --gap: 8px; --dock: calc(var(--row) * 3 + var(--gap) * 2 + 16px + env(safe-area-inset-bottom)); }
  @media (max-height: 480px) { :root { --row: 40px; --gap: 6px; } }
  @media (max-width: 340px) { :root { --row: 46px; } }
  #pad { position: fixed; inset: 0 0 var(--dock) 0; touch-action: none; user-select: none;
    -webkit-user-select: none; display: grid; place-items: center; text-align: center;
    background: radial-gradient(circle at 50% 40%, #182030, #0e1117 70%); }
  #hint { transition: opacity .6s; pointer-events: none; line-height: 1.6; }
  #hint b { color: #c9d4e8; }
  #dock { position: fixed; left: 0; right: 0; bottom: 0; height: var(--dock);
    display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--gap); align-items: stretch;
    padding: 8px calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
    background: #151a24; border-top: 1px solid #232b3a; }
  #dock button, #quit { border: 0; border-radius: 12px; background: #222b3c; color: #dbe4f5;
    font: inherit; font-size: 17px; touch-action: manipulation; min-width: 0; }
  #dock button:active, #dock button.on { background: #3a7bd5; }
  .zone { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
  .zone > button, .zone .pair { flex: 1; }
  .zone .pair { display: flex; gap: var(--gap); flex: 2; }
  .zone .pair button { flex: 1; }
  .zone.left button { font-size: 15px; }
  .dpad { display: grid; gap: var(--gap); grid-template-columns: repeat(3, var(--row)); grid-template-rows: repeat(3, var(--row));
    grid-template-areas: ". u ." "l . r" ". d ."; }
  .dpad button { font-size: 20px; }
  #quit { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right));
    z-index: 5; height: 40px; padding: 0 14px; font-size: 14px; background: rgba(34,43,60,.85); color: #aab6cc; }
  #quit.armed { background: #c0392b; color: #fff; }
  #dot { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 14px; width: 10px; height: 10px; border-radius: 50%;
    background: #d94c4c; box-shadow: 0 0 8px currentColor; color: #d94c4c; }
  #dot.ok { background: #3fc77a; color: #3fc77a; }
  #toast { position: fixed; left: 50%; bottom: calc(var(--dock) + 14px); transform: translateX(-50%); max-width: 80vw;
    padding: 8px 16px; border-radius: 18px; background: rgba(20,26,38,.95); color: #dbe4f5; font-size: 14px;
    opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #ripple { position: fixed; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%;
    border: 2px solid rgba(120,180,255,.7); pointer-events: none; opacity: 0; }
  #ripple.go { animation: rp .35s ease-out; }
  @keyframes rp { from { opacity: .9; transform: scale(.4); } to { opacity: 0; transform: scale(1.2); } }
  #kb { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0;
    resize: none; font-size: 16px; }
</style>
</head>
<body>
<div id="dot"></div>
<div id="pad"><div id="hint"><b>Touchpad</b><br>Drag to move · Tap to click<br>Two-finger tap = right click<br>Two-finger drag or flick = scroll</div></div>
<div id="ripple"></div>
<textarea id="kb" autocapitalize="sentences" autocomplete="off" autocorrect="on" spellcheck="true" aria-label="keyboard input"></textarea>
<button id="quit" aria-label="Quit running app">✕ Quit app</button>
<div id="toast"></div>
<div id="dock">
  <div class="zone left">
    <button data-act="steam" aria-label="Steam menu">Steam</button>
    <button data-act="qam" aria-label="Quick access menu">Quick access</button>
  </div>
  <div class="dpad">
    <button data-k="Up" data-repeat style="grid-area:u" aria-label="Up">▲</button>
    <button data-k="Left" data-repeat style="grid-area:l" aria-label="Left">◀</button>
    <button data-k="Right" data-repeat style="grid-area:r" aria-label="Right">▶</button>
    <button data-k="Down" data-repeat style="grid-area:d" aria-label="Down">▼</button>
  </div>
  <div class="zone right">
    <div class="pair">
      <button data-k="Escape" aria-label="Escape">Esc</button>
      <button data-k="Enter" aria-label="Enter">Enter</button>
    </div>
    <button id="kbBtn" aria-label="Keyboard">⌨</button>
  </div>
</div>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const pad = $('#pad'), dot = $('#dot'), kb = $('#kb'), ripple = $('#ripple'), hint = $('#hint');
  const token = new URLSearchParams(location.search).get('t') || '';
  let ws, retry = 0, queue = [];

  // ---- connection ----
  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws?t=${encodeURIComponent(token)}`);
    ws.onmessage = (e) => { try { const m = JSON.parse(e.data); if (m.t === 'toast') toast(m.m); } catch (err) {} };
    ws.onopen = () => { retry = 0; dot.className = 'ok'; queue.forEach((m) => ws.send(m)); queue = []; };
    ws.onclose = () => { dot.className = ''; setTimeout(connect, Math.min(3000, 300 * ++retry)); };
    ws.onerror = () => ws.close();
  }
  function send(o) {
    const s = JSON.stringify(o);
    if (ws && ws.readyState === 1) ws.send(s);
    else if (o.t !== 'm' && queue.length < 50) queue.push(s);
  }
  setInterval(() => ws && ws.readyState === 1 && send({ t: 'p' }), 5000);
  connect();

  // ---- viewport / wake lock ----
  const vv = window.visualViewport;
  const fit = () => document.documentElement.style.setProperty('--vh', (vv ? vv.height : innerHeight) + 'px');
  vv && vv.addEventListener('resize', fit); fit();
  async function wake() { try { await navigator.wakeLock.request('screen'); } catch (e) {} }
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && wake());
  wake();

  // ---- touchpad ----
  let mx = 0, my = 0, raf = 0;
  function flushMove() { raf = 0; if (mx || my) { send({ t: 'm', dx: +mx.toFixed(2), dy: +my.toFixed(2) }); mx = my = 0; } }
  function queueMove(dx, dy) { mx += dx; my += dy; if (!raf) raf = requestAnimationFrame(flushMove); }
  function ping(x, y) { ripple.style.left = x + 'px'; ripple.style.top = y + 'px';
    ripple.classList.remove('go'); void ripple.offsetWidth; ripple.classList.add('go'); }

  // Scrolling: finger travel is turned into wheel notches (STEP px each); a flick keeps going
  // and slows down exponentially (TAU ms), like a phone list. A new touch stops it.
  const STEP = 14, TAU = 350, MIN_FLICK = 0.25, MAX_V = 5;
  let sAcc = 0, sAccX = 0, samples = [], inertia = 0;
  function emitScroll(dy, dx) {
    sAcc += dy; sAccX += dx;
    const v = Math.trunc(sAcc / STEP), h = Math.trunc(sAccX / STEP);
    if (v || h) { sAcc -= v * STEP; sAccX -= h * STEP; send({ t: 's', dy: v, dx: h }); }
  }
  function stopInertia() { if (inertia) cancelAnimationFrame(inertia); inertia = 0; sAcc = sAccX = 0; }
  function startInertia() {
    const now = performance.now();
    const recent = samples.filter((s) => now - s[0] <= 100);
    samples = [];
    if (recent.length < 2) return;
    const span = Math.max(16, now - recent[0][0]);
    const cap = (v) => Math.max(-MAX_V, Math.min(MAX_V, v));
    let vy = cap(recent.reduce((a, s) => a + s[1], 0) / span), vx = cap(recent.reduce((a, s) => a + s[2], 0) / span);
    if (Math.hypot(vy, vx) < MIN_FLICK) return;
    let last = now;
    const tick = (t) => {
      const dt = Math.min(t - last, 32); last = t;
      const k = Math.exp(-dt / TAU); vy *= k; vx *= k;
      emitScroll(vy * dt, vx * dt);
      inertia = Math.hypot(vy, vx) > 0.03 ? requestAnimationFrame(tick) : 0;
    };
    inertia = requestAnimationFrame(tick);
  }

  let g = null; // current gesture
  const pts = (e) => Array.from(e.touches);
  pad.addEventListener('touchstart', (e) => {
    e.preventDefault();
    stopInertia(); samples = [];
    hint.style.opacity = 0;
    const t = pts(e);
    if (!g) {
      g = { start: performance.now(), n: t.length, moved: false,
            last: t.map((p) => [p.clientX, p.clientY]) };
    } else {
      g.n = Math.max(g.n, t.length); g.last = t.map((p) => [p.clientX, p.clientY]);
      if (g.n > 1) g.moved = false;
    }
  }, { passive: false });

  pad.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!g) return;
    const t = pts(e);
    const cur = t.map((p) => [p.clientX, p.clientY]);
    if (t.length === 1 && g.n === 1) {
      const dx = cur[0][0] - g.last[0][0], dy = cur[0][1] - g.last[0][1];
      if (!g.moved && Math.hypot(dx, dy) < 2 && performance.now() - g.start < 200) return;
      g.moved = true;
      queueMove(dx, dy);
    } else if (t.length >= 2 && g.last.length >= 2) {
      const dy = (cur[0][1] + cur[1][1]) / 2 - (g.last[0][1] + g.last[1][1]) / 2;
      const dx = (cur[0][0] + cur[1][0]) / 2 - (g.last[0][0] + g.last[1][0]) / 2;
      if (Math.abs(dy) + Math.abs(dx) > 0.5) g.moved = true;
      emitScroll(dy, dx);
      const now = performance.now();
      samples.push([now, dy, dx]);
      while (samples.length && now - samples[0][0] > 100) samples.shift();
    }
    g.last = cur;
  }, { passive: false });

  function end(e) {
    e.preventDefault();
    if (!g || e.touches.length) return;
    flushMove();
    if (g.n >= 2 && g.moved) startInertia();
    const dur = performance.now() - g.start;
    if (!g.moved && dur < 300) {
      const p = e.changedTouches[0];
      ping(p.clientX, p.clientY);
      send({ t: 'c', b: g.n >= 2 ? 'r' : 'l' });
    }
    g = null;
  }
  pad.addEventListener('touchend', end, { passive: false });
  pad.addEventListener('touchcancel', () => { g = null; });

  // ---- buttons ----
  const buzz = () => navigator.vibrate && navigator.vibrate(8);
  const toastEl = $('#toast'); let toastTimer = 0;
  function toast(m) { toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800); }
  // keys: tap once, or hold the arrows to repeat
  document.querySelectorAll('#dock [data-k]').forEach((b) => {
    let t1 = 0, t2 = 0;
    const stop = () => { clearTimeout(t1); clearInterval(t2); };
    b.addEventListener('pointerdown', () => {
      buzz(); send({ t: 'key', k: b.dataset.k }); stop();
      if (b.hasAttribute('data-repeat')) t1 = setTimeout(() => { t2 = setInterval(() => send({ t: 'key', k: b.dataset.k }), 80); }, 400);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => b.addEventListener(ev, stop));
  });
  document.querySelectorAll('#dock [data-act]').forEach((b) =>
    b.addEventListener('click', () => { buzz(); send({ t: 'act', a: b.dataset.act }); }));
  // quit needs a second tap within 3 s
  const quit = $('#quit'); let quitTimer = 0;
  const disarm = () => { clearTimeout(quitTimer); quit.classList.remove('armed'); quit.textContent = '✕ Quit app'; };
  quit.addEventListener('click', () => {
    buzz();
    if (quit.classList.contains('armed')) { disarm(); send({ t: 'act', a: 'quit' }); return; }
    quit.classList.add('armed'); quit.textContent = 'Tap again to quit'; quitTimer = setTimeout(disarm, 3000);
  });
  const kbBtn = $('#kbBtn');
  kbBtn.addEventListener('click', () => (document.activeElement === kb ? kb.blur() : kb.focus()));
  kb.addEventListener('focus', () => kbBtn.classList.add('on'));
  kb.addEventListener('blur', () => kbBtn.classList.remove('on'));
  // keep the keyboard open when pressing the other buttons
  document.querySelectorAll('#dock button, #quit').forEach((b) =>
    b.addEventListener('pointerdown', (e) => { if (document.activeElement === kb && b !== kbBtn) e.preventDefault(); }));

  // ---- text input: mirror textarea content, send minimal diffs (supports swipe typing, IME, autocorrect) ----
  const SENTINEL = ' ';
  let sent = SENTINEL, composing = false;
  kb.value = SENTINEL;
  function sync() {
    const v = kb.value;
    let i = 0; const n = Math.min(v.length, sent.length);
    while (i < n && v[i] === sent[i]) i++;
    const back = Array.from(sent.slice(i)).length;
    for (let k = 0; k < back; k++) send({ t: 'key', k: 'Backspace' });
    const add = v.slice(i);
    if (add) send({ t: 'k', text: add });
    sent = v;
    if (!composing && (v.length === 0 || v.length > 120)) { kb.value = sent = SENTINEL; }
  }
  kb.addEventListener('compositionstart', () => { composing = true; });
  kb.addEventListener('compositionend', () => { composing = false; sync(); });
  kb.addEventListener('input', (e) => {
    if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') return;
    sync();
  });
  kb.addEventListener('beforeinput', (e) => {
    if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') {
      e.preventDefault(); send({ t: 'key', k: 'Enter' });
    }
  });
  kb.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); send({ t: 'key', k: 'Enter' }); }
  });
})();
</script>
</body>
</html>
